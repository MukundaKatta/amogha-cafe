name: Build Kiosk APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'kiosk/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'scripts/build-kiosk.sh'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build kiosk web content
        run: sh scripts/build-kiosk.sh

      - name: Patch Capacitor config for Kiosk
        run: |
          sed -i "s|webDir: 'ios-dist'|webDir: 'kiosk-dist'|g" capacitor.config.ts
          sed -i "s|appName: 'Amogha Cafe'|appName: 'Amogha Kiosk'|g" capacitor.config.ts
          sed -i "s|appId: 'com.amoghahotels.cafe'|appId: 'com.amoghahotels.kiosk'|g" capacitor.config.ts

      - name: Patch Android app name for Kiosk
        run: |
          sed -i 's|<string name="app_name">Amogha Cafe</string>|<string name="app_name">Amogha Kiosk</string>|g' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">Amogha Cafe</string>|<string name="title_activity_main">Amogha Kiosk</string>|g' android/app/src/main/res/values/strings.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: amogha-kiosk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
