name: Deploy to Firebase

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Frontend dependencies ───────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      # ── Unit tests (Vitest) ─────────────────────────────────────────────
      - name: Run unit tests
        run: npm test -- --run

      # ── API tests (Jest + supertest) ────────────────────────────────────
      - name: Install functions dependencies
        run: cd functions && npm install

      - name: Run API tests
        run: cd functions && npm test

      # ── Build for E2E preview server ────────────────────────────────────
      - name: Build frontend
        run: npm run build

      # ── E2E tests (Playwright) ──────────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:4173

      - name: Upload E2E failure videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/

      # ── Deploy ──────────────────────────────────────────────────────────
      - name: Deploy to Firebase Hosting, Firestore rules, and Cloud Functions
        run: npx firebase-tools deploy --only hosting,firestore:rules,functions --token "$FIREBASE_TOKEN" --project amogha-cafe
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # ── Cleanup old hosting versions (keep last 3) ────────────────────
      - name: Delete old Firebase Hosting versions
        run: |
          SITE="amogha-cafe"
          TOKEN="${{ secrets.FIREBASE_TOKEN }}"
          API="https://firebasehosting.googleapis.com/v1beta1/sites/${SITE}/versions"

          # Get active version
          ACTIVE=$(curl -s "${API%/versions}/releases?pageSize=1" \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-user-project: $SITE" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          rs=d.get('releases',[])
          print(rs[0]['version']['name'].split('/')[-1] if rs else '')
          ")

          echo "Active version: $ACTIVE"

          # Collect all finalized versions (paginated)
          ALL_VERSIONS=""
          PAGE_TOKEN=""
          while true; do
            URL="${API}?pageSize=100"
            [ -n "$PAGE_TOKEN" ] && URL="${URL}&pageToken=${PAGE_TOKEN}"
            RESP=$(curl -s "$URL" -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $SITE")
            BATCH=$(echo "$RESP" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for v in d.get('versions',[]):
              vid=v['name'].split('/')[-1]
              if v.get('status')=='FINALIZED':
                  print(vid)
          ")
            ALL_VERSIONS="${ALL_VERSIONS}${BATCH}"$'\n'
            PAGE_TOKEN=$(echo "$RESP" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('nextPageToken',''))")
            [ -z "$PAGE_TOKEN" ] && break
          done

          # Keep active + 2 most recent = 3 total; delete the rest
          TO_DELETE=$(echo "$ALL_VERSIONS" | grep -v "^$" | grep -v "$ACTIVE" | tail -n +3)
          COUNT=$(echo "$TO_DELETE" | grep -c . || true)
          echo "Versions to delete: $COUNT"

          echo "$TO_DELETE" | while read -r VID; do
            [ -z "$VID" ] && continue
            curl -s -X DELETE "${API}/${VID}" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-goog-user-project: $SITE" > /dev/null
          done
          echo "Cleanup complete"
