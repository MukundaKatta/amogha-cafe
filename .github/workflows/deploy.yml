name: Deploy to Firebase

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # ── Frontend dependencies ───────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build frontend
        run: npm run build

      - name: Install functions dependencies
        run: cd functions && npm install

      # ── Pull latest POS APK so /pos-latest.apk stays live ──────────────
      # pos-latest.apk is gitignored (4 MB binary), so without this step
      # every deploy from CI would 404 the install URL staff use to update
      # POS tablets (learned the hard way when PR #65's auto-deploy wiped
      # the APK that was uploaded separately from a local machine).
      # Pull the most recent successful artifact from the build-pos-apk.yml
      # workflow and drop it at the repo root where firebase.json's
      # *.apk header rule serves it with the correct Android MIME type.
      - name: Pull latest POS APK artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RUN_ID=$(gh run list --workflow=build-pos-apk.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "No successful POS APK build yet — /pos-latest.apk will 404 until build-pos-apk.yml completes one."
            exit 0
          fi
          echo "Downloading APK from build-pos-apk.yml run $RUN_ID"
          mkdir -p /tmp/pos-apk
          gh run download "$RUN_ID" -n amogha-pos-debug -D /tmp/pos-apk
          cp /tmp/pos-apk/app-debug.apk pos-latest.apk
          ls -lh pos-latest.apk

      # TODO: Re-enable tests after E2E fixes are verified
      # ── Unit tests (Vitest) ─────────────────────────────────────────────
      # - name: Run unit tests
      #   run: npm test -- --run
      # ── API tests (Jest + supertest) ────────────────────────────────────
      # - name: Run API tests
      #   run: cd functions && npm test
      # ── E2E tests (Playwright) ──────────────────────────────────────────
      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps chromium
      # - name: Run E2E tests
      #   run: npm run test:e2e
      #   env:
      #     BASE_URL: http://127.0.0.1:4173
      # - name: Upload E2E failure videos
      #   if: failure()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: playwright-videos
      #     path: test-results/

      # ── Deploy ──────────────────────────────────────────────────────────
      - name: Deploy to Firebase Hosting, Firestore rules, and Cloud Functions
        run: npx firebase-tools deploy --only hosting,firestore:rules,functions --token "$FIREBASE_TOKEN" --project amogha-cafe
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # ── Cleanup old hosting versions (keep last 3) ────────────────────
      - name: Delete old Firebase Hosting versions
        run: |
          SITE="amogha-cafe"
          TOKEN="${{ secrets.FIREBASE_TOKEN }}"
          API="https://firebasehosting.googleapis.com/v1beta1/sites/${SITE}/versions"

          # Get active version
          ACTIVE=$(curl -s "${API%/versions}/releases?pageSize=1" \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-user-project: $SITE" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          rs=d.get('releases',[])
          print(rs[0]['version']['name'].split('/')[-1] if rs else '')
          ")

          echo "Active version: $ACTIVE"

          # Collect all finalized versions (paginated)
          ALL_VERSIONS=""
          PAGE_TOKEN=""
          while true; do
            URL="${API}?pageSize=100"
            [ -n "$PAGE_TOKEN" ] && URL="${URL}&pageToken=${PAGE_TOKEN}"
            RESP=$(curl -s "$URL" -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $SITE")
            BATCH=$(echo "$RESP" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for v in d.get('versions',[]):
              vid=v['name'].split('/')[-1]
              if v.get('status')=='FINALIZED':
                  print(vid)
          ")
            ALL_VERSIONS="${ALL_VERSIONS}${BATCH}"$'\n'
            PAGE_TOKEN=$(echo "$RESP" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('nextPageToken',''))")
            [ -z "$PAGE_TOKEN" ] && break
          done

          # Keep active + 2 most recent = 3 total; delete the rest
          TO_DELETE=$(echo "$ALL_VERSIONS" | grep -v "^$" | grep -v "$ACTIVE" | tail -n +3)
          COUNT=$(echo "$TO_DELETE" | grep -c . || true)
          echo "Versions to delete: $COUNT"

          echo "$TO_DELETE" | while read -r VID; do
            [ -z "$VID" ] && continue
            curl -s -X DELETE "${API}/${VID}" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-goog-user-project: $SITE" > /dev/null
          done
          echo "Cleanup complete"
