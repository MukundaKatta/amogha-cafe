name: Release iOS

# Builds signed IPA and uploads to TestFlight or submits for App Store review via fastlane.
# Requires macOS runner for Xcode build.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - testflight
          - app_store_review
          - build_only
        default: testflight

jobs:
  release-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci
        working-directory: .

      - name: Build web content for iOS
        run: npm run build:ios
        working-directory: .

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios/App

      - name: Install CocoaPods
        run: pod install

      - name: Run fastlane
        run: |
          if [ "${{ github.event.inputs.release_type }}" == "app_store_review" ]; then
            bundle exec fastlane release
          elif [ "${{ github.event.inputs.release_type }}" == "testflight" ]; then
            bundle exec fastlane beta
          else
            bundle exec fastlane build_only
          fi
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_CONTENT: ${{ secrets.APP_STORE_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          APP_IDENTIFIER: com.amoghahotels.cafe

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: amogha-cafe-ios
          path: ios/App/build/AmoghaCafe.ipa
          retention-days: 90
